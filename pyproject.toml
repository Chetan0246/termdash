[project]
name = "termdash"
version = "1.0.0"
description = "Realtime terminal dashboard: live metrics, logs and charts powered by Textual"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.60",
    "rich>=13.7",
    "textual-plotext>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[project.scripts]
termdash = "termdash.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/termdash"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101", "S311"]  # asserts in tests; random for simulation/jitter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "B017"]
